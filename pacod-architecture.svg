  <rect x="480" y="742" width="96" height="26" rx="7" fill="#2a2418"/><text x="528" y="760" class="chip" fill="#d7dbe5" text-anchor="middle">Rust · axum</text>
  <rect x="582" y="742" width="46" height="26" rx="7" fill="#2a2418"/><text x="605" y="760" class="chip" fill="#d7dbe5" text-anchor="middle">MCP</text>
  <rect x="634" y="742" width="88" height="26" rx="7" fill="#2a2418"/><text x="678" y="760" class="chip" fill="#d7dbe5" text-anchor="middle">no database</text>
  <rect x="728" y="742" width="72" height="26" rx="7" fill="none" stroke="#a78bfa" stroke-opacity=".7"/><text x="764" y="760" class="chip" fill="#c4b5fd" text-anchor="middle">access</text>
  <text x="480" y="788" class="sub">Models · MCP servers · agents · GPUs</text>

  <!-- AG -->
  <rect x="960" y="672" width="256" height="130" rx="14" fill="#211c12" stroke="#f59e0b" stroke-opacity=".55"/>
