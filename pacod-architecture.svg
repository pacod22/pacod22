  <rect x="64" y="180" width="256" height="426" rx="16" fill="#1c1630" stroke="#a78bfa" stroke-width="2"/>
  <rect x="84" y="200" width="48" height="42" rx="10" fill="#a78bfa"/>
  <text x="108" y="227" class="badge" text-anchor="middle" fill="#1c1630">ID</text>
  <text x="146" y="220" class="name">pacod-id</text>
  <text x="146" y="239" class="role" fill="#c4b5fd">IDENTITY &amp; ACCESS</text>
  <line x1="84" y1="260" x2="300" y2="260" stroke="#3b2f5c"/>
  <g class="item">
    <text x="84" y="290">OpenID Connect provider</text>
    <text x="84" y="320">Accounts · organisations</text>
    <text x="84" y="350">Role bindings</text>
    <text x="84" y="380">Change feed</text>
    <text x="84" y="410">Branded sign-in pages</text>
  </g>
  <line x1="84" y1="432" x2="300" y2="432" stroke="#3b2f5c"/>
  <text x="84" y="460" class="sub">Rules engine libraries</text>
  <text x="84" y="482" class="item">Rust · TypeScript · Python</text>
  <text x="84" y="516" class="sub">Built with</text>
  <text x="84" y="538" class="item">Rust · axum · SvelteKit</text>
