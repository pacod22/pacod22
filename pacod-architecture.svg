  <rect x="84" y="690" width="44" height="38" rx="9" fill="#fbbf24"/>
  <text x="106" y="715" class="badge" text-anchor="middle" fill="#0f1117">BM</text>
  <text x="142" y="707" class="name" style="font-size:18px">pacod-benchmark</text>
