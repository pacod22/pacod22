  <line x1="324" y1="393" x2="456" y2="393" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="7 5" marker-start="url(#mv)" marker-end="url(#mv)"/>
  <line x1="324" y1="541" x2="456" y2="541" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="7 5" marker-start="url(#mv)" marker-end="url(#mv)"/>
  <text x="390" y="312" class="lbl" fill="#a78bfa" text-anchor="middle">OIDC sign-in</text>
  <text x="390" y="330" class="lbl" fill="#a78bfa" text-anchor="middle">+ change feed</text>
  <text x="390" y="460" class="sub" text-anchor="middle">roles checked</text>
  <text x="390" y="478" class="sub" text-anchor="middle">locally</text>

  <!-- ===== model links (products -> GW) ===== -->
  <line x1="824" y1="245" x2="956" y2="245" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#mt)"/>
  <line x1="824" y1="393" x2="956" y2="393" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#mt)"/>
  <line x1="824" y1="541" x2="956" y2="541" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#mt)"/>
