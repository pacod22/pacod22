  <line x1="1088" y1="608" x2="1088" y2="670" stroke="#8b93a7" stroke-width="2.5"/>
  <line x1="192" y1="638" x2="1088" y2="638" stroke="#8b93a7" stroke-width="2.5"/>
  <line x1="192" y1="638" x2="192" y2="670" stroke="#8b93a7" stroke-width="2.5"/>
  <line x1="640" y1="638" x2="640" y2="670" stroke="#8b93a7" stroke-width="2.5"/>
  <text x="204" y="660" class="sub">measures it</text>
  <text x="652" y="660" class="sub">offers · discovers</text>
  <text x="1100" y="660" class="sub">model data, daily</text>

