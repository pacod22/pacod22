  <text x="538" y="363" class="name">pacod-cms</text>
  <text x="538" y="381" class="role" fill="#93c5fd">CONTENT MANAGEMENT</text>
  <rect x="480" y="398" width="168" height="26" rx="7" fill="#1f2738"/><text x="564" y="416" class="chip" fill="#d7dbe5" text-anchor="middle">Spring Boot · Thymeleaf</text>
  <rect x="656" y="398" width="64" height="26" rx="7" fill="#1f2738"/><text x="688" y="416" class="chip" fill="#d7dbe5" text-anchor="middle">studio</text>
  <rect x="728" y="398" width="72" height="26" rx="7" fill="none" stroke="#a78bfa" stroke-opacity=".7"/><text x="764" y="416" class="chip" fill="#c4b5fd" text-anchor="middle">access</text>
  <text x="480" y="444" class="sub">MongoDB — one database per site</text>

  <!-- KB -->
  <rect x="460" y="476" width="360" height="130" rx="14" fill="#151c2b" stroke="#3b82f6" stroke-opacity=".6"/>
  <rect x="480" y="494" width="44" height="38" rx="9" fill="#60a5fa"/>
  <text x="502" y="519" class="badge" text-anchor="middle" fill="#0f1117">KB</text>
