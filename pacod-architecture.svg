<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" role="img" aria-labelledby="t d">
  <title id="t">pacod architecture: components and interfaces</title>
  <desc id="d">pacod-id on the left provides OpenID Connect sign-in and a change feed to pacod-ap, pacod-cms and pacod-kb, which check access locally. The products send LLM calls in OpenAI, Anthropic or Gemini dialect to pacod-gw on the right, which holds provider keys, applies quotas and pricing, governs MCP tools and agents, records usage in ClickHouse and forwards calls to LLM providers. Below, three projects work with the gateway: pacod-benchmark measures it, pacod-broker is where it and the products offer and discover what can be called, and pacod-aggregator gives it model data read from the vendors' own pages.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .cap { font-size: 13px; font-weight: 700; fill: #8b93a7; letter-spacing: 1.6px; }
      .name { font-size: 20px; font-weight: 700; fill: #f5f6fa; }
      .role { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; }
      .item { font-size: 15px; fill: #d7dbe5; }
      .sub { font-size: 14px; fill: #9aa3b5; }
      .chip { font-size: 13px; font-weight: 600; }
      .badge { font-size: 16px; font-weight: 800; }
      .lbl { font-size: 13px; font-weight: 700; }
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
    </style>
    <marker id="mv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/></marker>
    <marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/></marker>
    <marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b93a7"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121521"/>
      <stop offset="1" stop-color="#0c0e14"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="900" rx="24" fill="url(#bg)"/>
  <text x="64" y="58" class="cap">ARCHITECTURE · COMPONENTS AND INTERFACES</text>

  <!-- people strip -->
  <rect x="460" y="80" width="360" height="52" rx="12" fill="#171a23" stroke="#2a2f3a"/>
  <text x="640" y="112" class="item" text-anchor="middle">People &amp; services use the products</text>
  <line x1="640" y1="134" x2="640" y2="174" stroke="#8b93a7" stroke-width="2.5" marker-end="url(#mn)"/>
  <text x="652" y="160" class="sub">HTTPS</text>

